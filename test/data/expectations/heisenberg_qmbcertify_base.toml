date = "2025-07-19 14:14:33 +0800"
remote = "git@github.com:wangjie212/QMBCertify.git"

[reviewed_reference_status_policy]
accepted_termination_statuses = ["OPTIMAL", "ALMOST_OPTIMAL"]
rejected_examples = ["SLOW_PROGRESS/FEASIBLE_POINT"]
rejection_note = "Rows outside accepted_termination_statuses are not reviewed references; keep them as failed_attempts or profile_probes until an exploratory variant demonstrates an accepted status."

[required_runs]
lattice = "1D periodic Heisenberg chain"
lengths = [10, 20, 30]
profiles = ["A0"]
required_fields = [
    "objective",
    "psd_block_histogram",
    "moment_count",
    "build_time_seconds",
    "solve_time_seconds",
    "peak_rss_bytes",
]
environment_required_fields = [
    "nctssos_commit",
    "julia_version",
    "mosek_version",
    "cpu_model",
    "ram_bytes",
    "thread_count",
    "blas_vendor",
]

