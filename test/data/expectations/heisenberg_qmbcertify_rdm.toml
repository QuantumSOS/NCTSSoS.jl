status = "pending_qmbcertify_runs"
notes = "QMBCertify RDM/state-opt Heisenberg-chain reference fixture scaffold. A guarded A1_L20 source-pinned RDM run is reviewed. A guarded A2_L20 run did not crowd the machine but returned SLOW_PROGRESS/FEASIBLE_POINT, so it is recorded as a failed attempt rather than a reviewed row. A2_L20 and A2_L30 are deleted from the active run queue until an accepted profile variant and fresh wall/RSS/load estimate justify restoration. A1_L10 is an extrapolated small probe target; A1_L10 and A2_L10, plus an A1_L10 rdm-only lso=false probe, returned DUAL_INFEASIBLE on 2026-06-29 and are failed attempts. Guarded A1_L12 and A2_L12 profile probes solved on 2026-06-30, suggesting the L=10 candidate failures are short-chain/profile artifacts rather than universal A1/A2 command failures."

