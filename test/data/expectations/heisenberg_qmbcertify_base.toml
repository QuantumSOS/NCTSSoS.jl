[qmbcertify_api]
entrypoint = "GSB"
source_file = "src/sdp.jl"

    [qmbcertify_api.defaults]
    lso = true
    lol = "Int(L/2)"
    pso = 3
    rdm = false
    extra = 0
    lattice = "chain"
    correlation = false
    gram = false
    quiet = false

    [qmbcertify_api.rdm]
    supported_chain_values = [8, 9, 10]
    local_word_filter = "even_axis_counts"
    reducer = "reduce4"
    block_source = "posepsd8!/posepsd9!/posepsd10!"
    unsupported_behavior = "print_only"

    [qmbcertify_api.linear_state_opt]
    candidate_generator = "generate_mons(L, lol, rdm-1)"
    closure_filter = "filter_mons"
    deduplication = "random_weight_row_hash"
    row_variable = "one_free_scalar_per_surviving_commutator"

    [qmbcertify_api.psd_state_opt]
    basis_filter = "length.(basis[i]) .<= pso"
    entry_function = "PSDstate_entry"
    endpoint_rule = "exactly_one_endpoint_changes"

[example_profile]
source_file = "examples/example.jl"
profile = "A0"
length = 10
d = 4
rdm = 0
pso = 2
lso = 1
lol = "N"
extra = 4
    mosek_tolerances = [1.0e-10, 1.0e-10, 1.0e-10]
