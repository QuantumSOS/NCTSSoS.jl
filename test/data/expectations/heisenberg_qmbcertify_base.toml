schema_version = 1
status = "pending_qmbcertify_runs"
notes = "QMBCertify base Heisenberg-chain reference fixture. A0_L10 has a reviewed small reference run. A guarded A0_L20 run on 2026-07-06 did not crowd the machine but returned SLOW_PROGRESS/FEASIBLE_POINT, so it is recorded as a failed attempt rather than a reviewed row. A0_L20 and A0_L30 are deleted from the active run queue until an accepted profile variant and fresh wall/RSS/load estimate justify restoration."

[source]
project = "QMBCertify"
