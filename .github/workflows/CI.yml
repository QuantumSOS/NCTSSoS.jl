name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12.3'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: '2'
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  docs:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Verify examples regen stamp
        run: julia --color=yes docs/examples_stamp.jl
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scs-extension:
    name: Native SCS extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.3'
      - name: Install standalone SCS environment
        env:
          JULIA_NUM_PRECOMPILE_TASKS: '2'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "scs-extension"))
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.add([PackageSpec(name="SCS", version="2.7.1"), PackageSpec(name="JuMP", version="1.32.1"), PackageSpec(name="ExplicitImports", version="1.15.0")])
          Pkg.precompile()
      - name: Test direct and indirect SCS with warm starts
        env:
          JULIA_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: julia --project="$RUNNER_TEMP/scs-extension" --startup-file=no -e 'include("test/next/conic/extensions.jl"); include("test/quality/ExplicitImports.jl")'
